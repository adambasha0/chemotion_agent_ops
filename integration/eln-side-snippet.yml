# Add this to chemotion_ELN as .github/workflows/doc-impact.yml.
#
# It is the only change the ELN repo needs for the triage half: a label on a PR
# calls the reusable workflow in chemotion_agent_ops, which comments. Nothing
# in the ELN repo is written.
#
# UNTESTED, and one thing here will not work as written: a PRIVATE repo owned
# by a USER cannot be called as a reusable workflow from another owner's repo.
# ComPlat/chemotion_ELN therefore cannot `uses:` the line below while
# chemotion_agent_ops lives under adambasha0 and is private. Options, cheapest
# first:
#   1. copy doc-impact-triage.yml into chemotion_ELN as a normal workflow and
#      check this repo out inside it (actions/checkout with a PAT) - works today
#   2. transfer chemotion_agent_ops to ComPlat and allow org access under
#      Settings > Actions - then this file works unchanged
#   3. make chemotion_agent_ops public - a public user repo can be called
# Also verify ANTHROPIC_API_KEY exists as an org or repo secret.
name: Doc impact

on:
  pull_request_target:
    # Opened: every new PR gets a verdict, which is what makes the pipeline
    # useful without anyone remembering to label. Labeled: a verdict after the
    # fact, when someone classifies an older PR.
    types: [opened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    # Every new PR; on a labelling event, only the labels worth a second look.
    # Draft PRs are skipped - they change too often to be worth a verdict.
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action == 'opened' ||
       contains(fromJSON('["new feature","enhancement","bug"]'),
                github.event.label.name))
    uses: adambasha0/chemotion_agent_ops/.github/workflows/doc-impact-triage.yml@main
    with:
      pr: ${{ github.event.pull_request.number }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
