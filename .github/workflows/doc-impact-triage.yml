# Agent 1: comment on a chemotion_ELN PR saying whether the docs need changing.
#
# Called from chemotion_ELN on every new PR, and on the labels worth a second
# look; see integration/eln-side-snippet.yml. It comments and nothing else: no
# commits, no PRs, in either repo.
#
# Two halves. The mechanical pre-triage is deterministic and always runs: it
# classifies the changed files, extracts the user-facing strings the diff adds
# and removes, and searches the documentation trees for the removed ones. The
# agent then reviews that evidence, if an API key is configured. Without a key
# the comment is the mechanical half alone, clearly labelled.
#
# The PR's code is never checked out. The diff comes from the API, so nothing
# from an untrusted branch is written to disk or executed - which matters,
# because pull_request_target runs with write permissions.
name: Doc impact triage

on:
  workflow_call:
    inputs:
      pr:
        description: PR number in chemotion_ELN
        required: true
        type: number
      saurus_ref:
        description: branch of chemotion_saurus to read
        required: false
        type: string
        default: main
    secrets:
      ANTHROPIC_API_KEY:
        # Optional. Without it the mechanical pre-triage still runs and still
        # comments; the agent's judgement is an addition, not a dependency.
        required: false

permissions:
  contents: read
  pull-requests: write
  # Pull request comments live behind the ISSUES endpoints, so listing them to
  # find our own comment needs this even though the subject is a PR. Without
  # it the list 403s and, under `set -o pipefail`, took the whole step down.
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the agent rules and scripts
        uses: actions/checkout@v4
        with:
          repository: adambasha0/chemotion_agent_ops
          path: ops

      - name: Check out the docs site
        uses: actions/checkout@v4
        with:
          repository: ComPlat/chemotion_saurus
          ref: ${{ inputs.saurus_ref }}
          path: saurus

      - name: Collect the diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --json baseRefOid,headRefOid \
            --jq 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"
          # From the API, not from a checkout: the PR's code never lands on disk.
          gh pr diff "$PR" --patch > /tmp/pr.diff
          wc -l < /tmp/pr.diff

      - name: Mechanical pre-triage
        run: |
          set -euo pipefail
          python3 ops/scripts/pre_triage.py \
            --diff /tmp/pr.diff --docs saurus \
            --pr '${{ inputs.pr }}' \
            --range '${{ steps.diff.outputs.baseRefOid }}..${{ steps.diff.outputs.headRefOid }}' \
            > /tmp/triage.md
          cat /tmp/triage.md

      - name: Is an API key available?
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${KEY:-}" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "no ANTHROPIC_API_KEY: posting the mechanical pre-triage alone"
          fi

      - name: Triage
        if: steps.key.outputs.have == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow ops/agents/01-doc-impact-triage.md exactly. Read
            ops/rules/saurus-docs.md before naming any page.

            The diff is at /tmp/pr.diff. The documentation site is checked out
            at ./saurus. The PR is #${{ inputs.pr }}, commit range
            ${{ steps.diff.outputs.baseRefOid }}..${{ steps.diff.outputs.headRefOid }}.

            /tmp/triage.md already holds a mechanical pre-triage: the file
            classification, the user-facing strings this diff adds and removes,
            and which documentation pages still use a removed string. Treat it
            as evidence to check, not as conclusions to repeat — its string
            matching is literal and it has looked at no screen.

            Rewrite /tmp/triage.md as the full comment, keeping any mechanical
            finding you confirm and saying where you disagree. Do not edit any
            other file, do not commit, and do not open a pull request.

      - name: Post or update the comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HAVE_KEY: ${{ steps.key.outputs.have }}
        run: |
          set -euo pipefail
          [ -s /tmp/triage.md ] || { echo "triage produced nothing" >&2; exit 1; }
          if [ "$HAVE_KEY" != "yes" ]; then
            printf '\n> No `ANTHROPIC_API_KEY` is configured for this repository, so this is the mechanical pre-triage only — no agent read the diff.\n' >> /tmp/triage.md
          fi
          # A marker so a re-run edits its own comment instead of adding one.
          printf '\n<!-- doc-impact-triage -->\n' >> /tmp/triage.md
          # Finding the previous comment is an optimisation, not the job:
          # tolerate a failure here rather than losing the comment entirely.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.body | contains("<!-- doc-impact-triage -->")) | .id' \
               2>/tmp/list.err | head -1 || true)
          [ -s /tmp/list.err ] && { echo "could not list comments:" >&2; cat /tmp/list.err >&2; }
          if [ -n "${id:-}" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@/tmp/triage.md
          else
            gh pr comment "$PR" --body-file /tmp/triage.md
          fi
