# Agent 2: get an instance, capture evidence, open a DRAFT PR on chemotion_saurus.
#
# UNTESTED SKELETON. Nothing in this file has run. Before trusting it, verify:
#   - the inputs and version of anthropics/claude-code-action
#   - DOKPLOY_* secrets, and that bin/dokploy.sh's endpoints match your Dokploy
#     (./bin/dokploy.sh --dry-run deploy eln <branch> prints them)
#   - ELN_EXEC reaches the deployed app's shell, or the flows seed through the
#     API instead (see docs/DOKPLOY.md)
#   - the token can push a branch to chemotion_saurus and open a PR
#
# Two providers. `dokploy` runs on a GitHub-hosted runner against a deployed
# instance and is the default. `local` needs a self-hosted runner with docker,
# a seeded database and the app image, and is the fallback.
name: Capture and document

on:
  workflow_dispatch:
    inputs:
      eln_ref:
        description: ELN ref to deploy and film (branch, tag or SHA)
        required: true
      provider:
        description: where the instance comes from
        type: choice
        options: [dokploy, local]
        default: dokploy
      pr:
        description: the ELN PR this follows from, for the PR body
        required: false
      note:
        description: what to document, if the triage comment is not enough
        required: false
  repository_dispatch:
    types: [capture-and-document]

permissions:
  contents: read

concurrency:
  # One capture at a time. The flows share one instance and one database, and
  # two runs at once corrupt each other's fixtures.
  group: chemotion-capture-${{ inputs.provider || 'dokploy' }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ${{ (inputs.provider || github.event.client_payload.provider) == 'local' && fromJSON('["self-hosted","chemotion-capture"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      ELN_PROVIDER: ${{ inputs.provider || github.event.client_payload.provider || 'dokploy' }}
      ELN_REF: ${{ inputs.eln_ref || github.event.client_payload.eln_ref }}
      ELN_PR: ${{ inputs.pr || github.event.client_payload.pr }}
      # The commit the sidecars record. On a deployed instance there is no
      # local tree to ask, and a sidecar without a commit is one nobody can
      # reproduce, so the harness refuses to write one.
      ELN_SHA: ${{ inputs.eln_ref || github.event.client_payload.eln_ref }}
      ELN_BASE: ${{ secrets.ELN_BASE }}
      ELN_EXEC: ${{ secrets.ELN_EXEC }}
      ELN_ADMIN_LOGIN: ${{ secrets.ELN_ADMIN_LOGIN }}
      ELN_ADMIN_PASSWORD: ${{ secrets.ELN_ADMIN_PASSWORD }}
      ELN_USER_LOGIN: ${{ secrets.ELN_USER_LOGIN }}
      ELN_USER_PASSWORD: ${{ secrets.ELN_USER_PASSWORD }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
      DOKPLOY_ELN_APP: ${{ secrets.DOKPLOY_ELN_APP }}
      ELN_ENV_FILE: /dev/null   # everything comes from the environment here
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops

      - uses: actions/checkout@v4
        with:
          repository: ComPlat/chemotion_saurus
          path: saurus
          fetch-depth: 0

      - name: Install the harness
        working-directory: ops
        run: npm ci || npm install

      - name: Deploy the ref and wait for it
        if: env.ELN_PROVIDER == 'dokploy'
        working-directory: ops
        run: |
          ./bin/dokploy.sh deploy eln "$ELN_REF"
          ./bin/dokploy.sh wait eln

      - name: Boot a local instance on the ref
        if: env.ELN_PROVIDER == 'local'
        working-directory: ops
        env:
          ELN_ENV_FILE: ${{ runner.temp }}/../eln.env   # kept off the workspace
        run: |
          ELN_BRANCH="$ELN_REF" ./bin/eln-up.sh
          ./bin/eln-restart.sh

      # A self-hosted runner keeps whatever the last job left behind, so the
      # cleanup below has to be unconditional rather than part of the happy
      # path. See the "Stop the instance" step at the end.

      - name: Confirm the instance serves the ref
        working-directory: ops
        run: |
          # A URL answering is not evidence of which code answered. Fail here
          # rather than filming the wrong branch.
          curl -fsS -o /dev/null "$ELN_BASE/users/sign_in"
          echo "instance answering at $ELN_BASE, recording ELN_SHA=$ELN_SHA"

      - name: Capture
        working-directory: ops
        run: ./bin/capture.sh all

      - name: Refuse to continue without evidence
        working-directory: ops
        run: python3 harness/lib/make_review.py   # non-zero if any asset lacks assertions

      - name: Publish the verified assets into the docs checkout
        working-directory: ops
        run: ./bin/publish.sh "${{ github.workspace }}/saurus/static/img"

      - name: Write the documentation
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow ops/agents/02-capture-and-document.md from step 6 onward —
            the instance is up and the assets are already published into
            ./saurus/static/img. Read ops/rules/saurus-docs.md to choose the
            tree, and ops/rules/evidence-gate.md for what the PR body must say.

            ELN ref: ${{ env.ELN_REF }}. ELN PR: ${{ env.ELN_PR }}.
            Extra instruction, if any: ${{ inputs.note }}

            Edit only files under ./saurus. Validate changed MDX by compiling it
            with @mdx-js/mdx; do not run the full Docusaurus build.
            Write the PR body to /tmp/pr-body.md.

      - name: Open a draft PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: saurus
          token: ${{ secrets.SAURUS_PR_TOKEN }}
          branch: docs/auto-${{ env.ELN_REF }}
          draft: true
          labels: documentation, needs-human-review
          title: "docs: ${{ env.ELN_REF }}"
          body-path: /tmp/pr-body.md
          commit-message: |
            docs: update for ELN ${{ env.ELN_REF }}

            Captured against ELN ${{ env.ELN_REF }}. Every asset carries a
            provenance sidecar; the PR body lists the assertions behind each.

      # The browser's view often does not explain a failure against a
      # deployment: a stalled job queue, a migration that did not run, a 500
      # whose body never reached the page. Pull the container log while the
      # instance is still up.
      - name: Collect the instance log on failure
        if: failure() && env.ELN_PROVIDER == 'dokploy'
        working-directory: ops
        continue-on-error: true
        run: ./bin/dokploy.sh logs eln > /tmp/instance.log 2>&1 || true

      # Always, and before the artifact upload so a cancelled or failed run
      # still releases the instance. An ELN left running holds several GB, a
      # connection pool and a worker for nothing.
      - name: Stop the instance
        if: always()
        working-directory: ops
        run: ./bin/teardown.sh || echo "teardown failed; check the instance by hand"

      - name: Upload the review page and the sidecars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-evidence
          path: |
            ops/review.html
            ops/harness/tasks/*/out/*.json
            /tmp/instance.log
